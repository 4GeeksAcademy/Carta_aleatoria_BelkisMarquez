<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./assets/img/4geeks.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Rigo with Vanilla.js</title>

  <!-- Fontawesome is our recomended library for icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
    integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous" />
</head>

<body>
  <div class="contenedor-general">
    <div id="card" class="carta">
      <h3 id="icon-superior" class="icon-superior">♣</h3>
      <h1 id="num" class="num">1</h1>
      <h3 id="icon-inferior" class="icon-inferior">♣</h3>
    </div>
    <div class="btn">
      <button id="btn-change" type="button"><strong> Change Card </strong></button>
    </div>
    <form action="" class="sizes" id="sizes">
      <label for="width"></label>
      <input type="number" name="width" id="width-card" placeholder="Ancho">
      <label for="heigth">--</label>
      <input type="number" name="heigth" id="heigth-card" placeholder="Alto">
    </form>
    <div class="btn-aplicar">
      <button id="btn-a" type="button">Aplicar</button>
    </div>
  </div>


  <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
  <script type="module" src="/app.js"></script>
</body>

</html>
